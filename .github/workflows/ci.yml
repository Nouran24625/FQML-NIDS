name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the project image (cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: fqml-nids:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests
        run: docker run --rm -v "$PWD":/workspace -w /workspace fqml-nids:dev python -m pytest -v

      - name: PQC smoke test
        run: docker run --rm -v "$PWD":/workspace -w /workspace fqml-nids:dev python -m fqml.pq.smoke

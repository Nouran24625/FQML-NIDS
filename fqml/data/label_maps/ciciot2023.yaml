# CICIoT2023 native label (34 = benign + 33 attacks) -> 8 families (Plan §6).
# Family index = readout qubit index. 0 MUST be Benign.
# Source: Neto et al., 2023 (CICIoT2023 paper), attack categorisation.
families: [Benign, DDoS, DoS, Recon, Web, BruteForce, Spoofing, Mirai]
attck:   # draft ATT&CK technique ids per family; finalise in P1 (Phase 1 "ATT&CK label maps")
  DDoS: T1498
  DoS: T1499
  Recon: T1595
  Web: T1190
  BruteForce: T1110
  Spoofing: T1557
  Mirai: T1498
# Variants of the family list. The 8 families above stay the PRIMARY task; a variant is only reported
# beside it. The cleaned file always stores the primary `family` / `y`; a variant's labels are derived
# from `native_label` when the data is loaded (fqml.data.label_maps.family_index).
variants:
  # Decision D17 (pending, 23 Nov 2026, after Checkpoint 1): DDoS and DoS as ONE family, 7 classes.
  # Why it may be needed: in CICIoT2023 the DDoS / DoS boundary may be a capture artifact (IAT alone
  # separates the two at AUC 0.998 in a public audit), not a traffic property.
  c7m:
    families: [Benign, DDoS_DoS, Recon, Web, BruteForce, Spoofing, Mirai]
    merge: {DDoS: DDoS_DoS, DoS: DDoS_DoS}
map:
  BenignTraffic: Benign
  DDoS-RSTFINFlood: DDoS
  DDoS-PSHACK_Flood: DDoS
  DDoS-SYN_Flood: DDoS
  DDoS-UDP_Flood: DDoS
  DDoS-TCP_Flood: DDoS
  DDoS-ICMP_Flood: DDoS
  DDoS-SynonymousIP_Flood: DDoS
  DDoS-ACK_Fragmentation: DDoS
  DDoS-UDP_Fragmentation: DDoS
  DDoS-ICMP_Fragmentation: DDoS
  DDoS-SlowLoris: DDoS
  DDoS-HTTP_Flood: DDoS
  DoS-UDP_Flood: DoS
  DoS-SYN_Flood: DoS
  DoS-TCP_Flood: DoS
  DoS-HTTP_Flood: DoS
  Recon-PingSweep: Recon
  Recon-OSScan: Recon
  Recon-PortScan: Recon
  Recon-HostDiscovery: Recon
  VulnerabilityScan: Recon
  BrowserHijacking: Web
  Backdoor_Malware: Web
  XSS: Web
  Uploading_Attack: Web
  SqlInjection: Web
  CommandInjection: Web
  DictionaryBruteForce: BruteForce
  DNS_Spoofing: Spoofing
  MITM-ArpSpoofing: Spoofing
  Mirai-greeth_flood: Mirai
  Mirai-greip_flood: Mirai
  Mirai-udpplain: Mirai

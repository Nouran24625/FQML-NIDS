name: fqml-nids
services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: fqml-nids:dev
    volumes:
      - ..:/workspace
    environment:
      MLFLOW_TRACKING_URI: sqlite:////workspace/mlruns/mlflow.db
    shm_size: "4gb"
    tty: true
    stdin_open: true

  mlflow:
    image: fqml-nids:dev
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////workspace/mlruns/mlflow.db --default-artifact-root /workspace/mlruns
    volumes:
      - ..:/workspace
    ports:
      - "5001:5000"
